[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-grooves"
version = "0.1.0"
description = "Discover music by mood: hybrid semantic search over Pitchfork album reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "numpy>=1.24",
    "sentence-transformers>=3.0",
    "sqlite-vec==0.1.6",
    "torch>=2.0",
]

[project.optional-dependencies]
# Only needed to rebuild the database from scratch.
build = ["kagglehub>=0.3", "ollama>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
sg = "semantic_grooves.cli:main"

[tool.setuptools.packages.find]
include = ["semantic_grooves*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
